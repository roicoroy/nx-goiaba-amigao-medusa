<div class="dashboard-container">
  <h2>Real-time Order Dashboard</h2>

  <!-- Connection Status -->
  <div class="connection-status" [style.background-color]="getStatusColor()">
    <span>{{ getStatusText() }}</span>
    <button
      *ngIf="connectionStatus === ConnectionStatus.ERROR"
      (click)="reconnect()"
      class="reconnect-btn">
      Reconnect
    </button>
  </div>

  <!-- Recent Orders -->
  <div class="recent-orders">
    <h3>Recent Orders ({{ recentOrders.length }})</h3>

    <div *ngIf="recentOrders.length === 0" class="no-orders">
      No recent orders. Waiting for new orders...
    </div>

    <div
      *ngFor="let order of recentOrders; trackBy: trackByOrderId"
      class="order-item">
      <div class="order-header">
        <span class="order-id">🆕 Order #{{ order.orderId }}</span>
        <span class="order-time">{{ order.timestamp | date:'short' }}</span>
      </div>
      <div class="order-details">
        <div>💰 Total: ${{ order.total }}</div>
        <div>📧 Customer: {{ order.customerEmail }}</div>
      </div>
    </div>
  </div>
</div>

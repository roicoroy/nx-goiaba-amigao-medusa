<ion-app>
  <ion-split-pane contentId="main-content" when="xs" *ngIf="isLoggedIn$ | async">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="admin-list">
          <ion-list-header>
            <div class="header-content">
              <div>
                <div class="header-title">Medusa Admin</div>
                <ion-note>Customer Orders Management</ion-note>
              </div>
              <app-notification-icon></app-notification-icon>
            </div>
          </ion-list-header>

          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>

  <!-- Show router outlet without menu when not logged in -->
  <ion-router-outlet id="main-content" *ngIf="!(isLoggedIn$ | async)"></ion-router-outlet>

</ion-app>

<div class="promo-banner w-full overflow-hidden" [ngClass]="getBackgroundColorClass()">
  <div class="container mx-auto px-4 md:px-6">
    <div class="flex flex-col md:flex-row items-center gap-4 md:gap-8 py-8 md:py-12">
      <!-- Text Content -->
      <div class="flex-1 text-center md:text-left">
        <h3 class="text-3xl md:text-4xl lg:text-5xl font-bold mb-2" [ngClass]="getTextColorClass()">
          {{ title }}
        </h3>
        <p class="text-xl md:text-2xl font-semibold mb-4" [ngClass]="getTextColorClass()">
          {{ subtitle }}
        </p>
      @if (buttonRoute) {
        <ion-button [routerLink]="buttonRoute" fill="solid" color="light" class="rounded-xl font-medium">
          {{ buttonText }}
        </ion-button>
      } @else if (buttonAction) {
        <ion-button (click)="handleButtonClick()" fill="solid" color="light" class="rounded-xl font-medium">
          {{ buttonText }}  
        </ion-button>
      } @else {
        <ion-button fill="solid" color="light" class="rounded-xl font-medium">
          {{ buttonText }}
        </ion-button>
      }
      </div>
      <!-- Icon/Image -->
      <div class="flex-shrink-0">
        <ion-icon [name]="iconName" class="text-8xl md:text-9xl lg:text-[12rem] opacity-90" [ngClass]="getTextColorClass()"></ion-icon>
      </div>
    </div>
  </div>
</div>

<div class="relative inline-block">
  <ion-button
    fill="clear"
    (click)="navigateToCart()"
    class="text-neutral-700 hover:text-goiaba-primary relative min-w-0 p-0">
    <ion-icon name="cart-outline" class="text-xl"></ion-icon>
    @if (itemCount() > 0) {
      <ion-badge
        color="danger"
        mode="ios"
        class="absolute -top-1 -right-1 text-xs px-1.5 py-0.5 rounded-full font-semibold min-w-[1.25rem] h-5 flex items-center justify-center">
        {{ itemCount() }}
      </ion-badge>
    }
  </ion-button>
</div>

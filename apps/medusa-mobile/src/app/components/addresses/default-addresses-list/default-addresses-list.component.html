<div class="address-list-container">
  @if (localAddresses && localAddresses.length > 0) {
    @for (add of localAddresses; track trackByAddressId($index, add)) {
      <div class="card bg-base-100 shadow-md border border-base-300 mb-4">
        <div class="card-body p-4">
          <app-address-view [address]="add"></app-address-view>

          <div class="default-selection flex flex-col sm:flex-row gap-3 mt-4">
            <button
              class="btn btn-outline flex-1"
              [class.btn-success]="add.is_default_billing"
              [class.btn-ghost]="!add.is_default_billing"
              (click)="isDefaultBilling(add.is_default_billing, add.id || '')"
              [disabled]="!add.id">
              <ion-icon name="card-outline" class="text-lg mr-2"></ion-icon>
              {{ add.is_default_billing ? 'Default Billing' : 'Set as Billing' }}
            </button>

            <button
              class="btn btn-outline flex-1"
              [class.btn-success]="add.is_default_shipping"
              [class.btn-ghost]="!add.is_default_shipping"
              (click)="isDefaultShipping(add.is_default_shipping, add.id || '')"
              [disabled]="!add.id">
              <ion-icon name="airplane-outline" class="text-lg mr-2"></ion-icon>
              {{ add.is_default_shipping ? 'Default Shipping' : 'Set as Shipping' }}
            </button>
          </div>

          <div class="action-buttons flex justify-end gap-2 mt-4 pt-4 border-t border-base-300">
            <button class="btn btn-sm btn-ghost" (click)="editAddress(add)">
              <ion-icon name="create-outline" class="mr-2"></ion-icon>
              Edit
            </button>
            <button class="btn btn-sm btn-ghost text-error" (click)="deleteAddress(add.id || '')" [disabled]="!add.id">
              <ion-icon name="trash-outline" class="mr-2"></ion-icon>
              Remove
            </button>
          </div>
        </div>
      </div>
    }
  } @else {
    <div class="empty-state text-center py-8">
      <ion-icon name="location-outline" class="text-6xl text-base-content/30 mb-4"></ion-icon>
      <p class="text-base-content/70 mb-4">You have no saved addresses.</p>
      <button class="btn btn-primary" (click)="addNewAddress()">
        <ion-icon name="add-circle-outline" class="mr-2"></ion-icon>
        Add a New Address
      </button>
    </div>
  }
</div>

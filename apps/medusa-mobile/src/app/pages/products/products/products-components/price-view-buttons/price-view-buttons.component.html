<div class="w-full">
    <div class="flex flex-wrap gap-2 p-4">
        <h3 class="w-full text-lg font-semibold text-neutral-900 mb-3">Price List</h3>
        @for (variant of variants; track variant.id) {
          <button 
            (click)="addToCartButton(variant)"
            class="px-4 py-2 bg-white border border-neutral-300 rounded-lg text-sm font-medium text-neutral-700 hover:bg-goiaba-primary hover:text-white hover:border-goiaba-primary transition-all duration-200 shadow-sm hover:shadow-md">
            {{ variant.title }} /
            {{ getVariantPrice(variant) | shortNumber | medusaCurrency:getVariantCurrency(variant) }}
          </button>
        }
    </div>
</div>

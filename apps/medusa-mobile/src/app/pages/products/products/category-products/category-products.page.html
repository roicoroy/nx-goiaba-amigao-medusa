<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/products"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <ng-container *ngIf="category$ | async as category; else loadingTitle">
        {{ category.name }}
      </ng-container>
      <ng-template #loadingTitle>
        Category Products
      </ng-template>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="category-products-content">
  <!-- Category Info -->
  <div class="category-header" *ngIf="category$ | async as category">
    <h1>{{ category.name }}</h1>
    <p *ngIf="category.description" class="category-description">{{ category.description }}</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading-container">
    <ion-spinner></ion-spinner>
    <p>Loading products...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ error }}</p>
    <ion-button (click)="loadProducts(categoryId$.value!, 1)" fill="outline">
      Try Again
    </ion-button>
  </div>

  <!-- Products Grid -->
  <div *ngIf="!loading && !error" class="products-container">
    <ion-grid>
      <ion-row>
        <ion-col 
          size="6" 
          size-md="4" 
          size-lg="3"
          *ngFor="let product of products$ | async">
          <ion-card class="product-card" (click)="onProductClick(product)">
            <div class="product-image-container">
              <ion-img 
                [src]="getProductImage(product)" 
                [alt]="product.title || 'Product'"
                class="product-image">
              </ion-img>
            </div>
            <ion-card-content>
              <h3 class="product-title">{{ product.title }}</h3>
              <p class="product-price">{{ getProductPrice(product) }}</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- Empty State -->
    <div *ngIf="(products$ | async)?.length === 0" class="empty-container">
      <ion-icon name="cube-outline"></ion-icon>
      <p>No products found in this category.</p>
    </div>

    <!-- Load More Button -->
    <div *ngIf="hasMorePages" class="load-more-container">
      <ion-button 
        expand="block" 
        (click)="loadMore()" 
        [disabled]="loadingMore">
        <ion-spinner *ngIf="loadingMore" name="crescent"></ion-spinner>
        <span *ngIf="!loadingMore">Load More</span>
        <span *ngIf="loadingMore">Loading...</span>
      </ion-button>
    </div>
  </div>

  <!-- Footer removed - component not found -->
</ion-content>
